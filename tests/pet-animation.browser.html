<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>眯了宝图片帧动作预览</title>
<style>
body { margin:0; padding:28px; color:#25423b; background:#eaf2ee; font:14px system-ui; }
h1 { font-size:23px; } #gallery { display:flex; flex-wrap:wrap; gap:16px; }
.card { display:grid; place-items:center; width:210px; padding:16px 8px; border:1px solid #d1e2d9; border-radius:22px; background:#f9fcfa; }
.card h2 { font-size:14px; } button { margin:20px 8px 20px 0; padding:9px 14px; border:1px solid #bacec0; border-radius:10px; background:white; color:inherit; cursor:pointer; }
pre { white-space:pre-wrap; line-height:1.7; }
</style>
<h1>眯了宝 · 原始图片帧动作</h1><div id="gallery"></div><div id="controls"></div><pre id="results">加载图片中…</pre>
<script type="module">
import {createApp,h,nextTick,ref} from 'vue';
import PetCharacter from '/src/components/DesktopPet/PetCharacter.vue';
import {preloadPetFrames,petAnimations} from '/src/utils/pet/petFrames.ts';
const direction=ref(1), replay=ref(0);
const actions=['idle','walking','running','jumping','sitting','sleeping'];
const names=['待机 · 快速眨眼','慢走 · 8 FPS','奔跑 · 12 FPS','跳跃 · 单次播放','坐下 · 保持坐姿','睡觉 · 保持睡姿'];
createApp({render:()=>actions.map((action,i)=>h('section',{class:'card'},[h('h2',names[i]),h(PetCharacter,{action,direction:direction.value,key:action+replay.value})]))}).mount('#gallery');
createApp({render:()=>[h('button',{onClick:()=>{direction.value*=-1;}},'切换朝向'),h('button',{onClick:()=>{replay.value++;}},'重播动作')]}).mount('#controls');
await preloadPetFrames();
await nextTick();
await Promise.all([...document.querySelectorAll('.pet-frame')].map(image=>image.decode()));
const lines=[];
function check(name,condition){lines.push((condition?'PASS':'FAIL')+' '+name);}
check('六组动作均使用提供的 PNG 图片',document.querySelectorAll('.pet-frame').length===6&&[...document.querySelectorAll('.pet-frame')].every(image=>image.naturalWidth===512&&image.naturalHeight===512));
check('待机快速眨眼，慢走和奔跑保持原速',petAnimations.idle.durations?.reduce((sum,ms)=>sum+ms,0)===2000&&petAnimations.walking.fps===8&&petAnimations.running.fps===12);
check('坐下和睡觉单次播放后保持姿势',['jumping','sitting','sleeping'].every(action=>!petAnimations[action].loop)&&['idle','walking','running'].every(action=>petAnimations[action].loop));
check('原始素材朝右，向右运动时无需翻转',!document.querySelector('.walking .pet-frame').classList.contains('flipped')&&!document.querySelector('.running .pet-frame').classList.contains('flipped'));
document.querySelector('#results').textContent=lines.join('\n');
document.title=lines.filter(line=>line.startsWith('PASS')).length+'/'+lines.length+' PASS — 眯了宝图片帧';
</script>
</html>
