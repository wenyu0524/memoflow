name: Build Windows executable

on:
  push:
    branches: ['codex/package-windows-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Select Rust stable
        run: rustup default stable
      - run: npm ci
      - name: Build executable and installer
        run: npm run tauri:build
      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-Windows-x64
          path: src-tauri/target/release/memoflow.exe
          if-no-files-found: error
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-Windows-x64-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
